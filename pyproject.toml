[project]
name = "agentcourses"
version = "0.1.0"
description = "Validate, describe and test Agent Courses."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "markdown-it-py>=3.0", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://agentcourses.io"
Source = "https://github.com/agentcourses/agentcourses"

[project.scripts]
agentcourses = "agentcourses.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcourses"]

# Schemas and conformance cases live at the repository root and ship inside the package.
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "agentcourses/schemas"
"conformance/cases" = "agentcourses/conformance_cases"

[tool.pytest.ini_options]
testpaths = ["tests"]
